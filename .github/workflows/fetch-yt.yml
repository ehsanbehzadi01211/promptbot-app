name: fetch-yt
on:
  push:
    branches: [reels-media]
    paths: [yt.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
      - name: Tools
        run: |
          pip install -q -U yt-dlp
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download, strip audio, split into 60 s parts
        run: |
          mkdir -p footage tmp
          while read -r name url; do
            [ -z "$name" ] && continue
            ls footage/${name}_* >/dev/null 2>&1 && continue
            case "$url" in
              rs:*) id=${url#rs:}; ok=0
                    for v in en-us-1080p global-1080p en-us-2160p global-2160p en-us-720p global-720p; do
                      curl -sSL --fail -o "tmp/$name.mp4" "https://videos-rockstargames-com.akamaized.net/v4/$id/flv/$v.mp4" && { echo "got $name $v"; ok=1; break; }
                    done
                    [ $ok = 1 ] || { echo "fail $name"; continue; } ;;
              *) yt-dlp -q --no-playlist -f "bv*[height<=1080][ext=mp4]/bv*[height<=1080]/b" -o "tmp/$name.%(ext)s" "$url" || { echo "fail $name"; continue; } ;;
            esac
            src=$(ls tmp/$name.* | head -1)
            ffmpeg -nostdin -v error -y -i "$src" -an -vf "scale=-2:1080,fps=30" -c:v libx264 -crf 24 -preset veryfast -pix_fmt yuv420p -f segment -segment_time 60 -reset_timestamps 1 "footage/${name}_%02d.mp4" && ls -la footage/${name}_*
          done < yt.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add footage
          git commit -m "Fetched footage" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin reels-media && git push && break; sleep 5; done
