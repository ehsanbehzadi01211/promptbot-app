# AI-news Telegram bot. The copy on the DEFAULT branch (main) runs the cron jobs; the copy on reels-media
# reacts to pushes. Code and state live on reels-media (newsbot/). Needs the repository secret
# TELEGRAM_BOT_TOKEN (Settings -> Secrets and variables -> Actions). Optional repository variable
# TELEGRAM_CHANNEL (e.g. @mychannel) if the channel is not found automatically.
name: newsbot
on:
  schedule:
    - cron: "7 */2 * * *"     # news every 2 hours
    - cron: "50 4 * * *"      # 08:20 Tehran: 7-day content schedule to the owner
  push:
    branches: [reels-media]
    paths: [content/schedule.json, content/queue.json, newsbot/run.txt]
  workflow_dispatch:
permissions:
  contents: write
concurrency: newsbot
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
          sparse-checkout: |
            newsbot
            content
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q feedparser
      - run: (date -u; python newsbot/discover.py) 2>&1 | tee newsbot/run_log.txt
      - if: (github.event_name == 'schedule' && github.event.schedule == '7 */2 * * *') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[news]'))
        run: (python newsbot/news.py fetch && python newsbot/news.py post) 2>&1 | tee -a newsbot/run_log.txt
      - if: (github.event_name == 'schedule' && github.event.schedule == '50 4 * * *') || github.event_name == 'workflow_dispatch'
        run: python newsbot/schedule.py daily 2>&1 | tee -a newsbot/run_log.txt
      - if: github.event_name == 'push'
        run: python newsbot/schedule.py new 2>&1 | tee -a newsbot/run_log.txt
      - name: Announce new Instagram/YouTube posts in the channel
        run: python newsbot/promo.py 2>&1 | tee -a newsbot/run_log.txt
      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add newsbot
          git commit -m "newsbot state" || exit 0
          git pull --rebase -q && git push
