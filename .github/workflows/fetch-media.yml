name: fetch-media
on:
  push:
    branches: [reels-media]
    paths: [fetch.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
      - name: Download listed files
        run: |
          mkdir -p media
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL --fail -o "media/$name" "$url" && echo "ok $name $(stat -c%s media/$name)"
          done < fetch.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git commit -m "Fetched media" || exit 0
          git push
