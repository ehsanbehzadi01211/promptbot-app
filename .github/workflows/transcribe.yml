name: transcribe
on:
  push:
    branches: [reels-media]
    paths: [transcribe.txt]
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q faster-whisper
      - run: python tools/transcribe.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add transcripts
          git commit -m "Transcripts" || exit 0
          git push
