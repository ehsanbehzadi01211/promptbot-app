name: ساخت صداهای شاهو (Gemini TTS)

on:
  workflow_dispatch:
    inputs:
      test:
        description: "فقط ۴ جملهٔ تستی؟"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: آماده کردن شاخهٔ voices
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          if git fetch --depth 1 origin voices:voices; then
            git worktree add store voices
          else
            git worktree add --detach store
            cd store && git checkout --orphan voices && git rm -rfq . && cd ..
          fi
      - name: ساخت صداها
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
          GEMINI_API_KEY2: ${{ secrets.GEMINI_API_KEY2 }}
          GEMINI_API_KEY3: ${{ secrets.GEMINI_API_KEY3 }}
          GEMINI_API_KEY4: ${{ secrets.GEMINI_API_KEY4 }}
          GEMINI_API_KEY5: ${{ secrets.GEMINI_API_KEY5 }}
          GEMINI_API_KEY_ALT1: ${{ secrets.GEMINI_KEY_1 }}
          GEMINI_API_KEY_ALT2: ${{ secrets.GEMINI_KEY_2 }}
          GEMINI_API_KEY_ALT3: ${{ secrets.GEMINI_KEY_3 }}
          VOICES_OUT: ${{ inputs.test && 'store/test_ep01' || 'store/voices_ep01' }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python shaho/make_voices_ep01.py --test
          else
            python shaho/make_voices_ep01.py
          fi
      - name: ذخیره در شاخهٔ voices
        if: always()
        run: |
          cd store
          git add -A
          git commit -m "صداهای شاهو $(date -u +%F_%H%M)" || echo "چیز جدیدی نبود"
          git push origin voices
