name: fetch-stock
on:
  push:
    branches: [reels-media]
    paths: [stock.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
      - name: Install ffmpeg
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - name: Download and transcode
        run: |
          mkdir -p stock tmp
          while read -r name url; do
            [ -z "$name" ] && continue
            [ -f "stock/$name.mp4" ] && continue
            curl -sSL --fail -o "tmp/$name.mov" "$url" || { echo "fail $name"; continue; }
            ffmpeg -nostdin -v error -y -i "tmp/$name.mov" -t 14 -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" -an -c:v libx264 -crf 25 -preset veryfast -pix_fmt yuv420p "stock/$name.mp4" && echo "ok $name $(stat -c%s stock/$name.mp4)"
          done < stock.txt
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add stock
          git commit -m "Fetched stock clips" || exit 0
          git push
