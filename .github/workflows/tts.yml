name: tts
on:
  push:
    branches: [reels-media]
    paths: [tts.json]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reels-media
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q edge-tts
      - run: python tools/tts.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add media
          git commit -m "TTS" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin reels-media && git push && break; sleep 5; done
