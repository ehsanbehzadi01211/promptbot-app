<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=1080,height=1920">
<script src="vendor/gsap.min.js"></script>
<style>
@font-face{font-family:Vz;font-weight:700;src:url(assets/fonts/vazirmatn-arabic-700-normal.woff2)}
@font-face{font-family:Vz;font-weight:400;src:url(assets/fonts/vazirmatn-arabic-400-normal.woff2)}
html,body{margin:0;background:#0b0d14}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Vz,sans-serif;color:#fff;background:radial-gradient(circle at 50% 30%,#1b2250,#0b0d14 70%)}
.clip{position:absolute;left:90px;right:90px;text-align:center}
.hook{top:420px;font-size:112px;font-weight:700;line-height:1.35}
.hook b{color:#ffd23f}
.n{top:330px;font-size:64px;color:#7c8cff;font-weight:700}
.t{top:470px;font-size:104px;font-weight:700;line-height:1.3}
.d{top:760px;font-size:56px;font-weight:400;color:#cfd3ff;line-height:1.6}
.cta{top:560px;font-size:96px;font-weight:700;line-height:1.35}
.cta b{color:#ffd23f}
.handle{bottom:150px;font-size:44px;color:#8890c8}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
 <div id="hook" class="clip hook" data-start="0" data-duration="2.6">ساخت ویدیو با هوش مصنوعی<br><b>بدون هیچ هزینه‌ای</b></div>
 <div id="n1" class="clip n" data-start="2.6" data-duration="2.8">۱</div>
 <div id="t1" class="clip t" data-start="2.6" data-duration="2.8">متن‌باز</div>
 <div id="d1" class="clip d" data-start="2.6" data-duration="2.8">لایسنس Apache 2.0<br>بدون هزینه‌ی رندر</div>
 <div id="n2" class="clip n" data-start="5.4" data-duration="2.8">۲</div>
 <div id="t2" class="clip t" data-start="5.4" data-duration="2.8">رندر روی سیستم خودت</div>
 <div id="d2" class="clip d" data-start="5.4" data-duration="2.8">فقط Node و FFmpeg</div>
 <div id="n3" class="clip n" data-start="8.2" data-duration="2.8">۳</div>
 <div id="t3" class="clip t" data-start="8.2" data-duration="2.8">ویدیو = کد HTML</div>
 <div id="d3" class="clip d" data-start="8.2" data-duration="2.8">هر بار خروجی دقیقاً یکسان</div>
 <div id="cta" class="clip cta" data-start="11" data-duration="3">زیر پست بنویس<br><b>«رایگان»</b></div>
 <div id="h" class="clip handle" data-start="0" data-duration="14">@ehbehzad</div>
</div>
<script>
const tl=gsap.timeline({paused:true});
const inn=(s,t)=>tl.fromTo(s,{opacity:0,y:40},{opacity:1,y:0,duration:.25,ease:"power3.out"},t);
inn("#hook",0);
[["1",2.6],["2",5.4],["3",8.2]].forEach(([k,t])=>{inn("#n"+k,t);inn("#t"+k,t+.1);inn("#d"+k,t+.25)});
inn("#cta",11);inn("#h",0);
window.__timelines["main"]=tl;
</script></body></html>
